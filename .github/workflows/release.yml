name: Release

# Releases are explicitly requested, never triggered by development commits/tags.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install toolchain and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.0.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify library and release consumers
        run: pnpm verify && pnpm test:package && pnpm test:git
      - name: Prepare compiled package
        id: package
        run: pnpm release:prepare
      - name: Publish versioned distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ steps.package.outputs.directory }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: node tools/publish-release.mjs
